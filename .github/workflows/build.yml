name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "VINA_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      # Audit findings #13/#14: run the byte-identical regression suite in CI
      # against an upstream AutoDock Vina 1.2.7 reference binary.
      - name: Download AutoDock Vina 1.2.7 reference binary
        run: |
          wget -q https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64 -O vina127
          chmod +x vina127
          ./vina127 --version

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBoost_USE_STATIC_LIBS=ON
          -DVINA_REGRESSION_TEST=ON
          -DVINA_127_BIN=${{ github.workspace }}/vina127

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: python scripts/package_release.py --build-dir build --platform Linux-x64 --version ${{ env.VINA_VERSION }} --output-dir dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: VinaMetalic-Linux-x64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: macOS-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost
        run: brew install boost

      # Homebrew ships shared-only Boost; the portability default
      # (USE_STATIC_BOOST=ON) is disabled for this platform build.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_BOOST=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  release:
    name: Publish release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
